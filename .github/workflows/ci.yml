name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check app.js
          node --check transcriber.js
          node --check audio-processor.js
          node --check storage.js
          node --check srt.js
          node --check captions.js
      - name: Unit tests
        run: |
          for t in test/*.test.mjs; do node "$t"; done
